<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" href="./add-to-cart.png">
  <title>Mi Lista Del Súper</title>
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="header">
        <p class="eyebrow">Tu próxima visita</p>
        <h1 id="page-title">Lista del súper</h1>
        <p class="subtitle">Anotá lo que te falta y listo.</p>
      </header>

      <form class="form" id="item-form">
        <input class="form-input" id="item-input" name="item" type="text" placeholder="Ingresá un producto a la lista"
          aria-label="Producto" maxlength="80" autocomplete="off" required />

        <button class="add" type="submit" aria-label="Agregar producto">
          +
        </button>
      </form>

      <div class="list-header">
        <h2 class="list-title">Productos</h2>
        <span class="count" id="pending-count" aria-live="polite"></span>
      </div>

      <div id="list-content"></div>

      <footer class="footer">
        <span id="total-count"></span>
        <button class="clear" id="clear-completed" type="button" hidden>
          Borrar comprados
        </button>
      </footer>

      <p class="storage-warning" id="storage-warning" role="status" hidden>
        Este navegador no permite guardar la lista, así que se pierde al recargar la página.
      </p>
    </section>
    <section class="footer-page">
      <p class="copy">&copy; 2026 <span>SuperListt</span> -</p>
      <p class="author">Desarrollado por <a href="https://github.com/mauroperez055" rel="noopener noreferrer">Mauro Perez</a></p>
    </section>
  </main>

  <script src="./js/list.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
